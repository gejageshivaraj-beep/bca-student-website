<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCA Student Registration</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1d4ed8);
    min-height: 100vh;
    padding: 25px 15px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    color: #1d4ed8;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #1d4ed8;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1e40af;
}

#message {
    text-align: center;
    margin-top: 18px;
    font-weight: bold;
}

.footer {
    text-align: center;
    margin-top: 25px;
    color: #666;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎓 BCA Student Registration</h1>

    <div class="subtitle">
        Student Details Form
    </div>

    <form id="studentForm">

        <label>Full Name</label>
        <input
            type="text"
            name="fullName"
            placeholder="Enter Full Name"
            required
        >

        <label>UUCMS Number</label>
        <input
            type="text"
            name="uucmsNumber"
            placeholder="Enter UUCMS Number"
            required
        >

        <label>Phone Number</label>
        <input
            type="tel"
            name="phoneNumber"
            placeholder="Enter 10 Digit Phone Number"
            maxlength="10"
            pattern="[0-9]{10}"
            required
        >

        <label>Date of Birth</label>
        <input
            type="date"
            name="dob"
            required
        >

        <label>Course</label>
        <select name="course" required>
            <option value="">Select Course</option>
            <option value="BCA">BCA</option>
            <option value="BCA 1st Semester">BCA 1st Semester</option>
            <option value="BCA 2nd Semester">BCA 2nd Semester</option>
            <option value="BCA 2nd Year">BCA 2nd Year</option>
            <option value="BCA 3rd Year">BCA 3rd Year</option>
        </select>

        <label>University</label>
        <input
            type="text"
            name="university"
            placeholder="Enter University Name"
            required
        >

        <label>About</label>
        <textarea
            name="about"
            rows="4"
            placeholder="Write about yourself"
        ></textarea>

        <button type="submit">
            Submit Details
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        Created by University 🎓
    </div>

</div>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzObxW8Im9aTKYcu_t_XtQvpGjq7knPgLX02TK4l5392AKsX-kBjooFvhuYiv-Qi6Cz/exec";


document.getElementById("studentForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const form = event.target;
    const button = form.querySelector("button");
    const message = document.getElementById("message");

    button.disabled = true;
    button.innerText = "Submitting...";

    const data = {
        fullName: form.fullName.value,
        uucmsNumber: form.uucmsNumber.value,
        phoneNumber: form.phoneNumber.value,
        dob: form.dob.value,
        course: form.course.value,
        university: form.university.value,
        about: form.about.value
    };

    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(data)
    })
    .then(function() {

        message.innerHTML =
        "✅ Details submitted successfully!";

        message.style.color = "green";

        form.reset();

        button.disabled = false;
        button.innerText = "Submit Details";

    })
    .catch(function(error) {

        message.innerHTML =
        "❌ Something went wrong. Please try again.";

        message.style.color = "red";

        button.disabled = false;
        button.innerText = "Submit Details";

    });

});

</script>

</body>
</html>
